services:
  vaba:
    image: trubft:ACS
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - ACS_N=4
      - ACS_T=1
      - ACS_B=100
    entrypoint: ["bash", "-c"]
    command:
      - |
        export PYTHONPATH=/app:$PYTHONPATH
        export LIBRARY_PATH=/usr/local/lib:$LIBRARY_PATH
        export LD_LIBRARY_PATH=/usr/local/lib:$LD_LIBRARY_PATH
        cd /app/conf
        rm -rf adkg_$${ACS_N:-4}
        python3 gen_config.py $${ACS_N:-4} $${ACS_T:-1} $$(( $${ACS_T:-1} + 1 )) $${ACS_B:-100}
        cd /app
        for i in $$(seq 0 $$(( $${ACS_N:-4} - 1 ))); do
          python3 scripts/vaba_run.py -f conf/adkg_$${ACS_N:-4}/local.$$i.json -time 1 -d > /tmp/acs_$$i 2>&1 &
        done
        wait
        echo "========== 测试结果 =========="
        for i in $$(seq 0 $$(( $${ACS_N:-4} - 1 ))); do
          echo "--- Node $$i ---"
          grep -E '(ADKG time|Bytes Sent|RBC0 payload)' /tmp/acs_$$i || echo "无输出"
        done

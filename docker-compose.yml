version: '3.8'

services:
  # ============================================
  # 参数配置区 - 修改这里的值来调整参数
  # ============================================
  trubft-standalone:
    image: trubft:TruBFT
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - TRUBFT_MODE=standalone
      - TRUBFT_N=4          # 节点数（目前只支持4）
      - TRUBFT_T=1          # 容错数（目前只支持1）
      - TRUBFT_B=100        # 每轮交易数
      - TRUBFT_TX=-1        # 总交易数（-1表示使用B的值）

  # 分布式模式（单节点）
  trubft-node:
    image: trubft:TruBFT
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - TRUBFT_MODE=distributed
      - TRUBFT_N=4
      - TRUBFT_T=1
      - TRUBFT_B=100
      - TRUBFT_TX=-1
      - TRUBFT_MY_ID=0
      - TRUBFT_VERSION=1

  # 分布式模式（4节点）
  trubft-node-0:
    image: trubft:TruBFT
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - TRUBFT_MODE=distributed
      - TRUBFT_N=4
      - TRUBFT_T=1
      - TRUBFT_B=100
      - TRUBFT_TX=-1
      - TRUBFT_MY_ID=0
      - TRUBFT_VERSION=1
    depends_on:
      - trubft-node-1
      - trubft-node-2
      - trubft-node-3

  trubft-node-1:
    image: trubft:TruBFT
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - TRUBFT_MODE=distributed
      - TRUBFT_N=4
      - TRUBFT_T=1
      - TRUBFT_B=100
      - TRUBFT_TX=-1
      - TRUBFT_MY_ID=1
      - TRUBFT_VERSION=1

  trubft-node-2:
    image: trubft:TruBFT
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - TRUBFT_MODE=distributed
      - TRUBFT_N=4
      - TRUBFT_T=1
      - TRUBFT_B=100
      - TRUBFT_TX=-1
      - TRUBFT_MY_ID=2
      - TRUBFT_VERSION=1

  trubft-node-3:
    image: trubft:TruBFT
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - TRUBFT_MODE=distributed
      - TRUBFT_N=4
      - TRUBFT_T=1
      - TRUBFT_B=100
      - TRUBFT_TX=-1
      - TRUBFT_MY_ID=3
      - TRUBFT_VERSION=1

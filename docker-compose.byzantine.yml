version: '3.8'

# 拜占庭节点测试配置
# 场景：Node 3 是拜占庭节点，完成握手后立即崩溃
# Node 0, 1, 2 是诚实节点，应能完成共识（N=4, t=1 容忍 1 个故障）

services:
  # 诚实节点 0
  trubft-node-0:
    image: trubft:TruBFT
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - TRUBFT_MODE=distributed
      - TRUBFT_N=4
      - TRUBFT_T=1
      - TRUBFT_B=100
      - TRUBFT_TX=-1
      - TRUBFT_MY_ID=0
      - TRUBFT_VERSION=1
      - TRUBFT_DELAY=50
    depends_on:
      - trubft-node-1
      - trubft-node-2
      - trubft-node-3

  # 诚实节点 1
  trubft-node-1:
    image: trubft:TruBFT
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - TRUBFT_MODE=distributed
      - TRUBFT_N=4
      - TRUBFT_T=1
      - TRUBFT_B=100
      - TRUBFT_TX=-1
      - TRUBFT_MY_ID=1
      - TRUBFT_VERSION=1
      - TRUBFT_DELAY=50
    depends_on:
      - trubft-node-2
      - trubft-node-3

  # 诚实节点 2
  trubft-node-2:
    image: trubft:TruBFT
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - TRUBFT_MODE=distributed
      - TRUBFT_N=4
      - TRUBFT_T=1
      - TRUBFT_B=100
      - TRUBFT_TX=-1
      - TRUBFT_MY_ID=2
      - TRUBFT_VERSION=1
      - TRUBFT_DELAY=50
    depends_on:
      - trubft-node-3

  # 拜占庭节点 3（握手后崩溃）
  trubft-node-3:
    image: trubft:TruBFT
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - TRUBFT_MODE=byzantine
      - TRUBFT_N=4
      - TRUBFT_T=1
      - TRUBFT_MY_ID=3

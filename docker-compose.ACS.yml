version: '3.8'

services:
  # Standalone模式服务
  trubft-standalone:
    image: trubft:ACS
    volumes:
      - .:/app
    environment:
      - TRUBFT_MODE=standalone
      - TRUBFT_N=${TRUBFT_N:-4}
      - TRUBFT_T=${TRUBFT_T:-1}
      - TRUBFT_B=${TRUBFT_B:-100}
      - TRUBFT_TX=${TRUBFT_TX:--1}
      - TRUBFT_KEYS=${TRUBFT_KEYS:-thsig4_1.keys}
      - TRUBFT_ECDSA=${TRUBFT_ECDSA:-ecdsa.keys}
      - TRUBFT_ENC=${TRUBFT_ENC:-thenc4_1.keys}

  # Distributed模式服务（动态节点）
  trubft-node:
    image: trubft:ACS
    volumes:
      - .:/app
    environment:
      - TRUBFT_MODE=distributed
      - TRUBFT_N=${TRUBFT_N:-4}
      - TRUBFT_T=${TRUBFT_T:-1}
      - TRUBFT_B=${TRUBFT_B:-100}
      - TRUBFT_TX=${TRUBFT_TX:--1}
      - TRUBFT_KEYS=${TRUBFT_KEYS:-thsig4_1.keys}
      - TRUBFT_ECDSA=${TRUBFT_ECDSA:-ecdsa.keys}
      - TRUBFT_ENC=${TRUBFT_ENC:-thenc4_1.keys}
      - TRUBFT_MY_ID=${TRUBFT_MY_ID:-0}
      - TRUBFT_VERSION=${TRUBFT_VERSION:-1}
      - TRUBFT_DELAY=${TRUBFT_DELAY:-50}

  # 预定义4节点配置
  trubft-node-0:
    image: trubft:ACS
    volumes:
      - .:/app
    environment:
      - TRUBFT_MODE=distributed
      - TRUBFT_N=${TRUBFT_N:-4}
      - TRUBFT_T=${TRUBFT_T:-1}
      - TRUBFT_B=${TRUBFT_B:-100}
      - TRUBFT_TX=${TRUBFT_TX:--1}
      - TRUBFT_KEYS=${TRUBFT_KEYS:-thsig4_1.keys}
      - TRUBFT_ECDSA=${TRUBFT_ECDSA:-ecdsa.keys}
      - TRUBFT_ENC=${TRUBFT_ENC:-thenc4_1.keys}
      - TRUBFT_MY_ID=0
      - TRUBFT_VERSION=${TRUBFT_VERSION:-1}
    depends_on:
      - trubft-node-1
      - trubft-node-2
      - trubft-node-3

  trubft-node-1:
    image: trubft:ACS
    volumes:
      - .:/app
    environment:
      - TRUBFT_MODE=distributed
      - TRUBFT_N=${TRUBFT_N:-4}
      - TRUBFT_T=${TRUBFT_T:-1}
      - TRUBFT_B=${TRUBFT_B:-100}
      - TRUBFT_TX=${TRUBFT_TX:--1}
      - TRUBFT_KEYS=${TRUBFT_KEYS:-thsig4_1.keys}
      - TRUBFT_ECDSA=${TRUBFT_ECDSA:-ecdsa.keys}
      - TRUBFT_ENC=${TRUBFT_ENC:-thenc4_1.keys}
      - TRUBFT_MY_ID=1
      - TRUBFT_VERSION=${TRUBFT_VERSION:-1}

  trubft-node-2:
    image: trubft:ACS
    volumes:
      - .:/app
    environment:
      - TRUBFT_MODE=distributed
      - TRUBFT_N=${TRUBFT_N:-4}
      - TRUBFT_T=${TRUBFT_T:-1}
      - TRUBFT_B=${TRUBFT_B:-100}
      - TRUBFT_TX=${TRUBFT_TX:--1}
      - TRUBFT_KEYS=${TRUBFT_KEYS:-thsig4_1.keys}
      - TRUBFT_ECDSA=${TRUBFT_ECDSA:-ecdsa.keys}
      - TRUBFT_ENC=${TRUBFT_ENC:-thenc4_1.keys}
      - TRUBFT_MY_ID=2
      - TRUBFT_VERSION=${TRUBFT_VERSION:-1}

  trubft-node-3:
    image: trubft:ACS
    volumes:
      - .:/app
    environment:
      - TRUBFT_MODE=distributed
      - TRUBFT_N=${TRUBFT_N:-4}
      - TRUBFT_T=${TRUBFT_T:-1}
      - TRUBFT_B=${TRUBFT_B:-100}
      - TRUBFT_TX=${TRUBFT_TX:--1}
      - TRUBFT_KEYS=${TRUBFT_KEYS:-thsig4_1.keys}
      - TRUBFT_ECDSA=${TRUBFT_ECDSA:-ecdsa.keys}
      - TRUBFT_ENC=${TRUBFT_ENC:-thenc4_1.keys}
      - TRUBFT_MY_ID=3
      - TRUBFT_VERSION=${TRUBFT_VERSION:-1}
